[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stage1st-forum-tui"
version = "0.1.0"
description = "An unofficial Stage1st terminal browser with login and daily check-in"
requires-python = ">=3.10"
dependencies = ["textual>=0.70", "httpx>=0.27", "beautifulsoup4>=4.12", "rich-pixels>=3.0", "Pillow>=10.0", "keyring>=25.0"]

[project.scripts]
stage1st-forum-tui = "s1tui.__main__:main"
s1-forum-tui = "s1tui.__main__:main"
s1tui = "s1tui.__main__:main"

[tool.setuptools.packages.find]
include = ["s1tui*"]
